url: https://pedrobtz.github.io/zudedup/
template:
  bootstrap: 5

# A release version (0.1.0) builds the site at the root; a development
# version (0.1.0.9000) builds it into dev/, leaving the released docs at the
# root. The deploy step keeps both (clean: false in pkgdown.yaml).
development:
  mode: auto

reference:
  - title: Chunking
    contents:
      - dedup_chunk
      - dedup_manifest
  - title: Stores
    contents:
      - dedup_store
      - dedup_backend
      - dedup_put
      - dedup_get
      - dedup_has
      - dedup_delete
  - title: About
    contents:
      - zudedup_info
  - title: Conditions
    contents:
      - zudedup-conditions
